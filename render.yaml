services:
  - type: web
    name: bayan-spaces
    runtime: node
    region: singapore
    plan: free
    branch: render-onprem-database

    # Keep deployments manual while the hybrid setup is being tested.
    autoDeployTrigger: off

    buildCommand: npm ci
    startCommand: npm run start:render
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # Public HTTPS Tailscale Funnel URL for the company server.
      - key: ONPREM_BASE_URL
        sync: false

      # Must exactly match RENDER_PROXY_SECRET on the on-prem server.
      - key: RENDER_PROXY_SECRET
        sync: false