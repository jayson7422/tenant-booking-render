services:
  - type: web
    name: bayan-spaces
    runtime: node
    region: singapore

    # Keep deployment manual while the production database
    # and migration are being prepared and verified.
    autoDeployTrigger: off

    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health

    envVars:
      # Production runtime
      - key: NODE_ENV
        value: production

      # Production MySQL/MariaDB application connection.
      # Real values are entered securely in Render.
      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: "3306"

      - key: DB_NAME
        sync: false

      - key: DB_USER
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: DB_CONNECTION_LIMIT
        value: "10"