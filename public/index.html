<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Launchpad Tenant</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/schedule.css"><style>#lp-loader{position:fixed;inset:0;z-index:9999;background:#f6f8f6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .35s ease,visibility .35s ease}#lp-loader.hidden{opacity:0;visibility:hidden;pointer-events:none}#lp-loader .lp-brand{font:800 22px Manrope,sans-serif;color:#1e3543;letter-spacing:-1px}#lp-loader .lp-brand i{font-style:normal;color:#17795f}#lp-loader .lp-spinner{width:36px;height:36px;border:3px solid #dff3e8;border-top-color:#17795f;border-radius:50%;animation:lp-spin .7s linear infinite}@keyframes lp-spin{to{transform:rotate(360deg)}}</style></head><body><div id="lp-loader"><div class="lp-brand">Launchpad<i> Tenant</i></div><div class="lp-spinner"></div></div><main id="app"></main><div id="modal"></div><script src="/app.js"></script></body></html>
